<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界最後の音楽隊 - リリックステージ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="canvas-host"></div>
      <div id="media" aria-hidden="true"></div>

      <div id="hud">
        <header class="hud-header">
          <div class="title-block">
            <h1>世界最後の音楽隊</h1>
            <p class="subtitle">夏山よつぎ × ど～ぱみん</p>
          </div>
          <div class="transport">
            <button id="btn-play" type="button" disabled>再生</button>
            <button id="btn-pause" type="button" disabled>一時停止</button>
            <button id="btn-stop" type="button" disabled>停止</button>
          </div>
        </header>

        <section class="lyric-panel" aria-live="polite">
          <p id="lyric-display" class="lyric-display"></p>
        </section>

        <section class="hint-panel">
          <p class="hint-main">
            <span class="hint-label">集める言葉</span>
            <span class="hint-words">オンガク · 旋律 · メロディ · 歌 · コエ</span>
          </p>
          <p class="hint-sub">集めた音：<span id="note-count">0</span></p>
          <label class="volume-control" for="volume-slider">
            <span class="volume-label">音量</span>
            <input id="volume-slider" type="range" min="0" max="100" value="100" />
          </label>
        </section>

        <footer class="hud-footer">
          <span id="beat-indicator">●</span>
        </footer>
      </div>

      <div id="maru-hikari-text-host" aria-live="polite" aria-hidden="true"></div>
      <div id="chiri-phrase-host" aria-hidden="true"></div>
      <div id="floating-collect-host" aria-hidden="true"></div>

      <div id="intro-overlay" class="intro-overlay hidden" aria-modal="true" role="dialog" aria-labelledby="intro-lead">
        <div class="intro-stack">
          <div class="intro-card">
            <p id="intro-lead" class="intro-lead">
              以下の言葉を歌詞から集めて<br />
              あなたの音楽隊を作りましょう。
            </p>
            <p class="intro-words">オンガク · 旋律 · メロディ · 歌 · コエ</p>
          </div>
          <button id="btn-start" type="button" disabled>再生</button>
        </div>
      </div>

      <div id="loading" class="loading-overlay">
        <div class="loading-card">
          <p class="loading-title">楽曲を読み込んでいます</p>
          <p class="loading-sub">世界最後の音楽隊</p>
        </div>
      </div>

      <div id="token-error" class="token-error hidden">
        <div class="token-error-card">
          <h2>アプリトークンが必要です</h2>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
